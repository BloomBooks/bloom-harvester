# Builds and tests BloomHarvester, replacing the TeamCity continuous config
# (Bloom_HarvesterMasterContinuous). Mirrors its steps: nuget restore, msbuild Release,
# dotnet test against the built test dll — plus fetching the Bloom dependencies first,
# which TeamCity did via build/getDependencies.ps1 too. That script now downloads the
# bundle that BloomDesktop's harvester-artifacts workflow publishes to the rolling
# GitHub Release tag harvester-development-latest (see this branch's change to
# build/getDependencies.ps1), so this workflow has no TeamCity dependency at all.
#
# Not yet covered here: publishing the harvester's own build for updateDeployment.ps1,
# which still downloads from the TeamCity configs (Bloom_HarvesterMasterContinuous /
# Bloom_HarvesterReleaseContinuous). Keep those TC configs alive until that is migrated
# (likely the same rolling-release pattern).

name: Build and Test

on:
    push:
        branches:
            - master
            - release
    workflow_dispatch:

# Pure CI with no publish step, so a newer commit makes the running build worthless.
concurrency:
    group: ci-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: windows-latest
        timeout-minutes: 60

        # checks: write lets the test-report step create its check run.
        permissions:
            contents: read
            checks: write

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
              with:
                  dotnet-version: 8.0.x

            - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

            # Downloads the Bloom dependency bundle from the rolling release published by
            # BloomDesktop's harvester-artifacts workflow and copies it into lib/dotnet.
            - name: Get Bloom dependencies
              shell: pwsh
              run: ./build/getDependencies.ps1

            - name: nuget restore
              run: nuget restore BloomHarvester.sln

            - name: msbuild
              shell: pwsh
              run: msbuild BloomHarvester.sln /m /p:Configuration=Release

            - name: dotnet test
              shell: pwsh
              run: dotnet test src/HarvesterTests/bin/Release/net8.0-windows7.0/BloomHarvesterTests.dll --logger trx --results-directory TestResults

            # Renders the results as a human-readable report: pass/fail/skip counts in the
            # job summary page, a check run on the commit, and per-test annotations for
            # failures. always() so the report appears precisely when tests DID fail.
            - name: Publish test results
              if: ${{ always() }}
              uses: EnricoMi/publish-unit-test-result-action/windows@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
              with:
                  check_name: Test results
                  trx_files: TestResults/*.trx
